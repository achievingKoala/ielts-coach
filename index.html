 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 return pool;
}
function drawQuestions(){
 return shuffle([...shuffle(questionBank.filter(q=>q.reading)).slice(0,2),...shuffle(questionBank.filter(q=>!q.reading)).slice(0,3)]);
}
let questions=drawQuestions();
const $ = id => document.getElementById(id);
let current=0, selected=null, answered=false, score=0;
let firstSelected=null, sessionAttempts=[];
function sessionStats(){
 const completed=sessionAttempts.length;
 const located=sessionAttempts.filter(a=>a.firstLocated).length;
 const classified=sessionAttempts.filter(a=>a.classified).length;
 const repairs=sessionAttempts.filter(a=>a.mode==='repair');
 const types=sessionAttempts.filter(a=>a.mode!=='repair');
 const rate=n=>completed?Math.round(n/completed*100):0;
 return {completed,located,classified,locationRate:rate(located),typeRate:rate(classified),repairs,types};
}
function updateSessionLabel(){
 const stats=sessionStats();
 $('scoreLabel').textContent=`已完成 ${stats.completed} 题`;
}
const chartSeries=[
 {name:'Northland',values:[8,7,6],color:'#334c6b',dash:''},
 {name:'Southland',values:[6,7,6],color:'#a65c40',dash:'8 4'},
 {name:'Eastland',values:[2,4,5],color:'#59794b',dash:'3 3'},
 {name:'Westland',values:[1,2,3],color:'#7d628e',dash:'10 3 2 3'}
];
function chartSVG(){
 const x=i=>70+i*225,y=value=>305-value*25;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" role="img" aria-label="模拟折线图：四国2000、2010和2020年人均二氧化碳排放量，单位为吨" style="display:block;width:100%;height:auto;font-family:Arial,sans-serif">
 <rect width="650" height="410" fill="#fff"/><text x="28" y="28" font-size="16" font-weight="bold" fill="#30382b">CO₂ emissions per person, 2000–2020</text><text x="28" y="50" font-size="12" fill="#777">Metric tonnes · fictional practice data</text>
 ${[0,2,4,6,8].map(v=>`<line x1="70" y1="${y(v)}" x2="520" y2="${y(v)}" stroke="#e0e3da"/><text x="56" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#666">${v}</text>`).join('')}
 <path d="M70 85 V305 H535" fill="none" stroke="#7b8274"/>
 ${[2000,2010,2020].map((v,i)=>`<text x="${x(i)}" y="329" text-anchor="middle" font-size="13" fill="#555">${v}</text>`).join('')}
 ${chartSeries.map(series=>`<polyline points="${series.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${series.color}" stroke-width="2.5" stroke-dasharray="${series.dash}"/>${series.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${series.color}"/>`).join('')}`).join('')}
 ${chartSeries.map((series,i)=>{const left=45+(i%2)*290,top=365+Math.floor(i/2)*25;return `<line x1="${left}" y1="${top}" x2="${left+35}" y2="${top}" stroke="${series.color}" stroke-width="2.5" stroke-dasharray="${series.dash}"/><text x="${left+44}" y="${top+4}" font-size="13" fill="#444">${series.name}</text>`;}).join('')}</svg>`;
}
const co2Image='assets/co2-emissions-line-chart.webp';
function sentenceChartSVG(spec){
 const colors=['#59794b','#a65c40','#536e91','#887199'];
 const text=(x,y,value,size=14,anchor='start')=>`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="#4b5547">${escapeHTML(String(value))}</text>`;
 let content='';
 if(spec.type==='process'){
  const steps=['1. Roast in oven','2. Grind beans','3. Package'];
  content=steps.map((label,i)=>`<rect x="${25+i*212}" y="140" width="180" height="90" rx="12" fill="#edf3e7" stroke="#78966a"/>${text(115+i*212,191,label,15,'middle')}${i<2?text(221+i*212,191,'→',24,'middle'):''}`).join('');
 }else if(spec.type==='map'){
  content=[0,1].map(i=>{const left=25+i*325;return `${text(left+140,92,i?'AFTER':'BEFORE',14,'middle')}<rect x="${left}" y="110" width="280" height="210" rx="12" fill="#edf3e7"/><path d="M${left+135} 110 Q${left+95} 205 ${left+155} 320" stroke="#b4d4df" stroke-width="55" fill="none"/>${text(left+198,285,'River',13,'middle')}${i?`<path d="M${left+35} 204 H${left+245}" stroke="#7b756b" stroke-width="17"/>${text(left+140,177,'New bridge',14,'middle')}`:''}`;}).join('');
 }else if(spec.type==='table'){
  content=`<rect x="70" y="92" width="510" height="220" rx="8" fill="#f5f7f0"/>${text(95,125,'Region')}${text(550,125,'Income (USD)',14,'end')}`+spec.labels.map((label,i)=>`<line x1="85" y1="${145+i*54}" x2="565" y2="${145+i*54}" stroke="#dce2d4"/>${text(95,178+i*54,label)}${text(550,178+i*54,spec.values[i].toLocaleString('en-US'),16,'end')}`).join('');
 }else if(spec.type==='pie'){
  let start=-Math.PI/2;content=spec.values.map((v,i)=>{const end=start+v/100*Math.PI*2;const a=[175+100*Math.cos(start),208+100*Math.sin(start)],b=[175+100*Math.cos(end),208+100*Math.sin(end)];const path=`<path d="M175 208 L${a} A100 100 0 ${v>50?1:0} 1 ${b} Z" fill="${colors[i]}" stroke="white" stroke-width="2"/>`;start=end;return path+`<rect x="330" y="${128+i*47}" width="14" height="14" rx="3" fill="${colors[i]}"/>${text(355,140+i*47,spec.labels[i]+': '+v+'%')}`;}).join('');
 }else{
  const max=Math.max(...spec.values)*1.2,base=300,plot=200;
  const x=i=>spec.type==='line'?90+i*450/(spec.values.length-1):90+(i+.5)*450/spec.values.length;
  const y=v=>base-v/max*plot;
  content=Array.from({length:5},(_,i)=>{const v=max*i/4,yy=y(v);return `<line x1="70" y1="${yy}" x2="575" y2="${yy}" stroke="#e0e3da"/>${text(58,yy+4,Number(v.toFixed(1)),11,'end')}`;}).join('');
  if(spec.type==='line')content+=`<polyline points="${spec.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${colors[0]}" stroke-width="3"/>`;
  content+=spec.values.map((v,i)=>`${spec.type==='line'?`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${colors[0]}"/>`:`<rect x="${x(i)-Math.min(36,150/spec.values.length)}" y="${y(v)}" width="${Math.min(72,300/spec.values.length)}" height="${base-y(v)}" rx="3" fill="${colors[i%4]}"/>`}${text(x(i),y(v)-12,v,13,'middle')}${text(x(i),324,spec.labels[i],12,'middle')}`).join('');
 }
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" role="img" aria-label="${escapeHTML(spec.title+'; '+spec.unit)}" style="display:block;width:100%;height:auto;font-family:Arial,sans-serif"><rect width="650" height="360" fill="white"/>${text(25,30,spec.title,17)}${text(25,54,spec.unit,12)}${content}</svg>`;
}
function renderChart(q){
 $('chartPanel').hidden=!q.chart;
 if(!q.chart)return;
 const markup=q.chartId==='housing'?`<img src="assets/housing-owned-rented.webp" alt="1918至2011年英格兰和威尔士家庭自有住房与租房比例柱状图" style="display:block;width:100%;max-width:600px;margin:auto;height:auto">`:q.chartId==='nutrients'?`<img src="${nutrientsImage}" alt="美国平均每日钠、饱和脂肪和添加糖摄入在早餐、午餐、晚餐和零食之间的分布" style="display:block;width:100%;max-width:600px;margin:auto;height:auto">`:q.chartSpec?sentenceChartSVG(q.chartSpec):q.chartId==='co2'?`<img src="${co2Image}" alt="1967至2007年英国、瑞典、意大利和葡萄牙人均二氧化碳排放折线图，单位为公吨" style="display:block;width:100%;height:auto">`:chartSVG();
 $('chartSmall').innerHTML=markup;$('chartLarge').innerHTML=markup;
 $('chartCaption').textContent=q.chartId==='housing'?'配图来源：用户提供 · 英格兰和威尔士住房占比':q.chartId==='nutrients'?'配图来源：用户提供 · 每日营养摄入占比':q.chartId==='co2'?'配图来源：导入题库 11-test3 · 四国人均 CO₂ 排放量':'原创模拟数据 · 用于读图训练';
}
$('enlargeChart').onclick=()=>$('chartDialog').showModal();

let audioContext, soundEnabled=true;
try { soundEnabled=localStorage.getItem('redpen-sound')!=='off'; } catch (_) {}
function updateSoundButton(){ $('soundToggle').textContent=soundEnabled?'♪ 音效开':'♪ 音效关'; $('soundToggle').setAttribute('aria-pressed',String(soundEnabled)); }
function playSound(kind){
 if(!soundEnabled)return;
 try {
  const AudioAPI=window.AudioContext||window.webkitAudioContext;if(!AudioAPI)return;
  audioContext ||= new AudioAPI();
  if(audioContext.state==='suspended') audioContext.resume().catch(()=>{});
  const notes={tap:[[560,0,.045]],next:[[440,0,.06],[580,.07,.07]],correct:[[523,0,.1],[659,.1,.1],[784,.2,.16]],wrong:[[220,0,.13],[165,.14,.17]],complete:[[523,0,.12],[659,.13,.12],[784,.26,.12],[1047,.4,.25]]}[kind];
  notes.forEach(([frequency,delay,duration])=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),start=audioContext.currentTime+delay;oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.09,start+.008);gain.gain.exponentialRampToValueAtTime(.001,start+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+duration+.02);});
 }catch (_) { /* Audio is optional; the game remains playable. */ }
}
$('soundToggle').onclick=()=>{soundEnabled=!soundEnabled;if(!soundEnabled&&audioContext)audioContext.suspend().catch(()=>{});try{localStorage.setItem('redpen-sound',soundEnabled?'on':'off');}catch(_){}updateSoundButton();if(soundEnabled)playSound('tap');};
updateSoundButton();
function render(){
const q=questions[current];prepareSecondStep(q); selected=null;firstSelected=null;answered=false;
renderChart(q);
$('progressLabel').innerHTML=`QUESTION ${String(current+1).padStart(2,'0')} <span class="text-[#94988a]">/ ${String(questions.length).padStart(2,'0')}</span>`;
updateSessionLabel();
$('progress').innerHTML=questions.map((_,i)=>`<div class="h-1 flex-1 rounded-full" style="background:${i<=current?'#6b805c':'#e1e3d7'}"></div>`).join('');
$('topic').textContent=q.topic; $('sentence').replaceChildren();
q.tokens.forEach((token,i)=>{const b=document.createElement('button');b.className='word';b.textContent=token;b.setAttribute('aria-pressed','false');b.onclick=()=>select(i);$('sentence').append(b,document.createTextNode(' '));});
$('hint').textContent='每句话只有一处目标错误，点击即可标记。';
$('choicesTitle').textContent=q.mode==='repair'?'选出正确的替换表达':'这属于哪一类错误？';
$('choices').replaceChildren();
q.options.forEach((option,i)=>{const b=document.createElement('button');b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABC'[i];b.append(letter,document.createTextNode(option));b.onclick=()=>answer(i);$('choices').append(b);});
['choicesSection','feedback','nextWrap'].forEach(id=>$(id).hidden=true);
$('next').innerHTML=current===questions.length-1?'查看本轮成绩 <span class="ml-5">→</span>':'下一题 <span class="ml-5">→</span>';
}
function select(i){
 if(answered)return;
 const q=questions[current],found=i===q.target;
 if(firstSelected===null)firstSelected=i;
 playSound(found?'correct':'wrong');selected=i;
 [...$('sentence').querySelectorAll('button')].forEach((b,n)=>{b.classList.toggle('selected',n===i);b.setAttribute('aria-pressed',String(n===i));});
 $('hint').textContent=found?`已找对「${q.tokens[i]}」，${q.mode==='repair'?'请选择下方替换表达':'请选择下方错误类型'}。`:'这处不是目标错误，再找找看。';
 $('choicesSection').hidden=!found;
}

function escapeHTML(text){return text.replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));}
function correctionMarkup(q){
 const before=q.tokens.slice(0,q.target).join(' '),after=q.tokens.slice(q.target+1).join(' ');
 const prefix=before?before+' ':'',suffix=after?' '+after:'';
 const replacement=q.correction.slice(prefix.length,q.correction.length-suffix.length);
 return escapeHTML(prefix)+'<del style="color:#ad4d37;text-decoration-thickness:2px">'+escapeHTML(q.tokens[q.target])+'</del> <ins style="color:#325535;text-decoration:none;border-bottom:2px solid #78966a;font-weight:600">'+escapeHTML(replacement)+'</ins>'+escapeHTML(suffix);
}
function answer(i){if(answered||selected!==questions[current].target)return;answered=true;const q=questions[current],found=selected===q.target,classified=i===q.category,correct=found&&classified;if(correct)score++;sessionAttempts.push({firstLocated:firstSelected===q.target,classified,mode:q.mode,finalLocated:found});playSound(correct?'correct':'wrong');
[...$('sentence').querySelectorAll('button')].forEach((b,n)=>{b.disabled=true;b.classList.remove('selected');b.classList.toggle('answer',n===q.target);b.classList.toggle('missed',n===selected&&!found);});
[...$('choices').children].forEach((b,n)=>{b.disabled=true;b.classList.toggle('correct',n===q.category);b.classList.toggle('wrong',n===i&&!classified);});
$('hint').textContent=`正确标记：${q.tokens[q.target]} · ${q.options[q.category]}`;
updateSessionLabel();
$('feedback').style.background=correct?'#edf3e7':'#fcf2eb';$('feedback').style.borderColor=correct?'#d4e0c9':'#eedbce';
$('feedback').innerHTML=`<div class="font-semibold text-sm mb-5">${correct?'✅ 找得准，改得对！':!found?'❌ 目标词选错了，再看一下绿色标记。':(q.mode==='repair'?'❌ 找对了位置，但替换表达还不正确。':'❌ 找对了位置，但错误类型还差一点。')}</div><div class="tiny text-[#7b8172] mb-2">Correction</div><p class="serif text-xl leading-relaxed mb-4">${correctionMarkup(q)}</p><div class="tiny text-[#7b8172] mb-2">Explanation</div><p class="text-sm leading-7 m-0">${q.explanation}</p>`;
$('feedback').hidden=false;$('nextWrap').hidden=false;
}
$('next').onclick=()=>{if(!answered)return;if(current<questions.length-1){playSound('next');current++;render();}else{playSound('complete');$('game').hidden=true;$('results').hidden=false;const stats=sessionStats();$('resultScore').textContent=`完成 ${stats.completed} 题`;$('resultText').textContent=`定位正确 ${stats.located}/${stats.completed}（${stats.locationRate}%）`;$('resultSkills').textContent=`${[stats.types.length?`类型判断正确 ${stats.types.filter(a=>a.classified).length}/${stats.types.length}`:'',stats.repairs.length?`修改正确 ${stats.repairs.filter(a=>a.classified).length}/${stats.repairs.length}`:''].filter(Boolean).join(' · ')}`;$('restart').focus();}};
$('restart').onclick=()=>{playSound('next');questions=drawQuestions();current=0;score=0;sessionAttempts=[];firstSelected=null;$('results').hidden=true;$('game').hidden=false;render();};
render();
</script>
</body>
