function splitSentencePhrases(question){
 const tokens=[];
 let target=0;
 question.tokens.forEach((phrase,index)=>{
  if(index===question.target){target=tokens.length;tokens.push(phrase);return;}
  const words=phrase.split(/\s+/);
  for(let start=0;start<words.length;start+=3)tokens.push(words.slice(start,start+3).join(' '));
 });
 return {...question,tokens,target};
}

function shuffle(pool){
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 return pool;
}

 return shuffle([...shuffle(questionBank.filter(q=>q.reading)).slice(0,2),...shuffle(questionBank.filter(q=>!q.reading)).slice(0,3)]);

function sentenceChartSVG(spec){

 }else if(spec.type==='pie'){

 }else{
  const max=Math.max(...spec.values)*1.2,base=300,plot=200;
  const x=i=>spec.type==='line'?90+i*450/(spec.values.length-1):90+(i+.5)*450/spec.values.length;
  const y=v=>base-v/max*plot;
  content=Array.from({length:5},(_,i)=>{const v=max*i/4,yy=y(v);return `<line x1="70" y1="${yy}" x2="575" y2="${yy}" stroke="#e0e3da"/>${text(58,yy+4,Number(v.toFixed(1)),11,'end')}`;}).join('');

 }

  notes.forEach(([frequency,delay,duration])=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),start=audioContext.currentTime+delay;oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.09,start+.008);gain.gain.exponentialRampToValueAtTime(.001,start+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+duration+.02);});

}

function select(i){if(answered)return;playSound(i===questions[current].target?'correct':'wrong');selected=i;[...$('sentence').querySelectorAll('button')].forEach((b,n)=>{b.classList.toggle('selected',n===i);b.setAttribute('aria-pressed',String(n===i));});$('hint').textContent=`已标记「${questions[current].tokens[i]}」，请选择下方错误类型。`;$('choicesSection').hidden=false;}
function escapeHTML(text){return text.replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));}
function correctionMarkup(q){
 const before=q.tokens.slice(0,q.target).join(' '),after=q.tokens.slice(q.target+1).join(' ');
 const prefix=before?before+' ':'',suffix=after?' '+after:'';
 const replacement=q.correction.slice(prefix.length,q.correction.length-suffix.length);
 return escapeHTML(prefix)+'<del style="color:#ad4d37;text-decoration-thickness:2px">'+escapeHTML(q.tokens[q.target])+'</del> <ins style="color:#325535;text-decoration:none;border-bottom:2px solid #78966a;font-weight:600">'+escapeHTML(replacement)+'</ins>'+escapeHTML(suffix);
}

$('feedback').hidden=false;$('nextWrap').hidden=false;
}
